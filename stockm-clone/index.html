<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stockm.shop — Clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700;900&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= LOGIN PAGE ================= -->
<div id="page-login" class="login-page">
  <div class="login-card">
    <div class="login-topbar-actions">
      <button class="icon-btn" id="loginDarkToggle" title="Dark mode"><i class="pi pi-sun"></i></button>
      <button class="icon-btn icon-btn-primary" title="Theme"><i class="pi pi-palette"></i></button>
    </div>

    <div class="login-logo">
      <svg width="46" height="46" viewBox="0 0 48 48" fill="none">
        <path d="M34 8 14 20v8l20-12v-8z" fill="#3C3895"/>
        <path d="M14 40l20-12v-8L14 32v8z" fill="#5B54D9"/>
      </svg>
      <div class="login-logo-text">
        <span class="brand">stockm.shop</span>
        <span class="brand-sub">ပစ္စည်းစာရင်းဆော့ဝဲ</span>
      </div>
    </div>
    <p class="login-subtitle">ဆက်လက်အသုံးပြုရန် ဝင်ပါ</p>

    <form id="loginForm" autocomplete="off">
      <label class="field-label">အီးမေးလ် (သို့) ဖုန်းနံပါတ်<span class="req">*</span></label>
      <input class="text-input" type="text" id="loginId" placeholder="example@gmail.com (or) 09xxxxxxxxx">

      <label class="field-label">စကားဝှက်<span class="req">*</span></label>
      <div class="password-wrap">
        <input class="text-input" type="password" id="loginPw" placeholder="စကားဝှက် ထည့်ပါ">
        <button type="button" class="eye-btn" id="togglePw"><i class="pi pi-eye"></i></button>
      </div>

      <div class="forgot-row"><a href="#" class="link">စကားဝှက်မေ့နေပါသလား</a></div>

      <button type="submit" class="btn-primary">ဝင်မယ်</button>
    </form>

    <button class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Sign in with Google
    </button>

    <p class="register-row">အကောင့်မရှိဘူးလား။ <a href="#" class="link">အကောင့်ဖွင့်ပါ။</a></p>

    <div class="social-row">
      <a class="social-btn" href="#" title="Telegram"><i class="pi pi-telegram"></i></a>
      <a class="social-btn" href="#" title="Facebook"><i class="pi pi-facebook"></i></a>
      <a class="social-btn" href="#" title="YouTube"><i class="pi pi-youtube"></i></a>
      <a class="social-btn" href="#" title="TikTok"><i class="pi pi-video"></i></a>
      <a class="social-btn" href="#" title="Phone"><i class="pi pi-phone"></i></a>
    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="page-app" class="layout-wrapper" hidden>
  <header class="layout-topbar">
    <div class="layout-topbar-logo-container">
      <button class="layout-topbar-action" id="menuToggle"><i class="pi pi-bars"></i></button>
      <a class="layout-topbar-logo" href="#/dashboard/admin">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none">
          <path d="M34 8 14 20v8l20-12v-8z" fill="#3C3895"/>
          <path d="M14 40l20-12v-8L14 32v8z" fill="#5B54D9"/>
        </svg>
        <span class="topbar-brand">stockm.shop</span>
      </a>
    </div>
    <div class="layout-topbar-actions">
      <button class="layout-topbar-action" id="darkToggle" title="Dark mode"><i class="pi pi-sun"></i></button>
      <button class="layout-topbar-action topbar-action-highlight" title="Theme"><i class="pi pi-palette"></i></button>
      <button class="layout-topbar-action" id="logoutBtn" title="ထွက်မယ်"><i class="pi pi-sign-out"></i></button>
    </div>
  </header>

  <aside class="layout-sidebar" id="sidebar">
    <ul class="layout-menu" id="layoutMenu"><!-- rendered by app.js --></ul>
  </aside>

  <div class="layout-main-container">
    <main class="layout-main" id="mainContent"><!-- rendered by app.js --></main>
    <footer class="layout-footer">stockm.shop clone — for learning purposes</footer>
  </div>

  <div class="layout-mask" id="layoutMask"></div>
</div>

<script src="api.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>
</body>
</html>
